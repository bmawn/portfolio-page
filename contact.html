<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/logo_anim.css" />
    <link rel="stylesheet" href="styles/styles.css" />
  </head>
  <body>
    <header>
      <nav class="navbar" aria-label="Hemsida">
        <div class="container-fluid">
          <a class="navbar-brand" href="splash.html">
            <img
              class="bouncing-logo"
              src="assets/Custom_computers_by_bmawnFINAL.svg"
              alt="homepage"
            />
          </a>

          <ul class="navbar-nav flex-row gap-3">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Hem</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="projects.html">Projekt</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">Om mig</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Kontakt</a>
            </li>
          </ul>
        </div>
      </nav>
    </header>
    <main class="contact-page">
      <h1>Kontakt</h1>
      <form class="contact-form" aria-label="Kontaktformulär">
        <label for="name">Ditt namn:</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Bosse Byggare"
          required
        />
        <label for="mail">Mailadress:</label>
        <input
          type="email"
          id="mail"
          name="mail"
          placeholder="bossebyggare@datorer.se"
          required
        />
        <label for="contact">Beskriv ditt ärende:</label>
        <textarea
          id="contact"
          name="contact"
          rows="8"
          placeholder="..."
          required
        ></textarea>
        <input class="button" type="submit" value="Skicka" />
      </form>
    </main>
    <footer>By Bmawn 2026</footer>
  </body>
</html>

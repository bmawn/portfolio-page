<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/logo_anim.css" />
    <link rel="stylesheet" href="styles/styles.css" />
  </head>

  <body>
    <header>
      <nav class="navbar" aria-label="Hemsida">
        <div class="container-fluid">
          <a class="navbar-brand" href="splash.html">
            <img
              class="bouncing-logo index-logo"
              src="assets/Custom_computers_by_bmawnFINAL.svg"
              alt="homepage"
            />
          </a>

          <ul class="navbar-nav flex-row gap-3">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Hem</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="projects.html">Projekt</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">Om mig</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Kontakt</a>
            </li>
          </ul>
        </div>
      </nav>
    </header>
    <main>
      <h1>Välkommen till</h1>
      <img
        src="assets/Custom_computers_by_bmawnFINAL.svg"
        class="welcome-logo"
        alt="By Bmawn logotyp"
      />
      <p>
        Klicka på bilderna för att komma till mina projekt, eller navigera med
        hjälp av knapparna i toppen av sidan.
      </p>
      <div
        id="carouselExampleIndicators"
        class="carousel slide"
        data-bs-ride="carousel"
      >
        <div class="carousel-indicators">
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="0"
            class="active"
            aria-current="true"
            aria-label="Slide 1"
          ></button>
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="1"
            aria-label="Slide 2"
          ></button>
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="2"
            aria-label="Slide 3"
          ></button>
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="3"
            aria-label="Slide 4"
          ></button>
        </div>
        <div class="carousel-inner">
          <div class="carousel-item active">
            <a href="projects.html">
              <img
                src="assets/slide1DK.jpg"
                class="d-block w-100"
                alt="Dark Knightmare"
              />
            </a>
          </div>
          <div class="carousel-item">
            <a href="projects.html">
              <img
                src="assets/bluefractalsslide.jpg"
                class="d-block w-100"
                alt="Blue Fractals"
              />
            </a>
          </div>
          <div class="carousel-item">
            <a href="projects.html">
              <img
                src="assets/whitedreamslide.jpg"
                class="d-block w-100"
                alt="White dream"
              />
            </a>
          </div>
          <div class="carousel-item">
            <a href="projects.html">
              <img
                src="assets/fractalera2carousel.jpg"
                class="d-block w-100"
                alt="Blue Fractals"
              />
            </a>
          </div>
        </div>
        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#carouselExampleIndicators"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#carouselExampleIndicators"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </main>
    <footer>By Bmawn 2026</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splash page</title>
    <link rel="stylesheet" href="styles/styles.css" />
  </head>
    <body class="splash-body page-transition">
      <div class="splash-container">
        <img
          src="/assets/splashwelcome.png"
          alt="Portfolio cover image"
          class="splash-image"
        />
        <!-- <a href="index.html" class="continue-btn">Fortsätt till Portfolio</a>
       hade först en knapp men ville prova fortsätta efter en kort delay istället, alt. klicka vartsomhelst på sidan -->
      </div>

      <script>
        const delay = setTimeout(continueToPortfolio, 3000);

        function continueToPortfolio() {
          clearTimeout(delay);
          document.body.classList.add("is-leaving");

          setTimeout(() => {
            window.location.href = "index.html";
          }, 350);
        }

        document.addEventListener("click", continueToPortfolio, { once: true });

        document.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            continueToPortfolio();
          }
        });
      </script>
    </body>
</html>
